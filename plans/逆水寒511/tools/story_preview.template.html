<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Microsoft YaHei","PingFang SC",sans-serif}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:7px;background:white;color:inherit}button{padding:7px 13px;cursor:pointer}button:hover{border-color:var(--accent);background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #84beb3;outline-offset:2px}button:disabled{cursor:default;opacity:.5}select,input{padding:7px 10px;max-width:100%}button.active{background:var(--accent);color:white;border-color:var(--accent)}[hidden]{display:none!important}
.shell{max-width:1440px;margin:0 auto;padding:24px 30px 32px}.mast{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}.mast h1{font-size:25px;margin:0;letter-spacing:.03em}.mast p{margin:1px 0 0;color:var(--muted);font-size:13px}.stage{display:flex;gap:5px;background:#e4e9eb;padding:4px;border-radius:9px}.stage button{border:0;background:none;padding:7px 13px}.stage button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0001}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;padding-bottom:10px}.tabs button{background:none;border:0;font-weight:600}.tabs button.active{background:var(--accent);color:white}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.pad{padding:20px 24px}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bar.between{justify-content:space-between}.bar h2,.bar h3{margin:0}h2{font-size:20px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:13px}.caption{padding:12px 20px;border-bottom:1px solid var(--line);background:#fafbfc}.caption p{margin:0}.pill{display:inline-block;font-size:12px;background:#f0f3f5;color:var(--muted);padding:2px 8px;border-radius:20px}.pill.force{color:var(--force);background:#faeee9}.pill.guile{color:var(--guile);background:#eaf3f9}.pill.charm{color:var(--charm);background:#f2ecf8}.mono{font:12px/1.5 Consolas,monospace;overflow-wrap:anywhere}.empty{padding:32px;color:var(--muted);text-align:center}
.layout-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.map-controls{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}.map-controls label{display:flex;align-items:center;gap:5px}.map-wrap{position:relative;background:#edf0ea;overflow:hidden;touch-action:none}.map-wrap svg{display:block;width:100%;height:590px;cursor:grab}.map-wrap svg.dragging{cursor:grabbing}.map-tools{position:absolute;left:14px;bottom:14px;display:flex;gap:5px}.map-tools button{background:#fffE;min-width:35px}.legend{padding:10px 16px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:5px}.dot.prop{border-radius:2px;background:#b08958}.dot.player{background:#4385a2}.map-note{padding:0 16px 13px;font-size:12px;color:var(--muted)}.object-row{width:100%;display:flex;align-items:center;text-align:left;gap:9px;margin-bottom:5px;border-color:transparent;background:none;padding:7px 9px}.object-row.selected{background:var(--soft);border-color:#a3c9bf}.object-row span:first-child{font-weight:600}.object-row small{display:block;color:var(--muted);font-weight:400}.object-list{max-height:280px;overflow:auto}.object-detail{margin-top:14px;border-top:1px solid var(--line);padding-top:16px}.facts{display:grid;grid-template-columns:70px 1fr;gap:5px 10px;font-size:13px;margin:10px 0 16px}.facts dt{color:var(--muted)}.facts dd{margin:0}.svg-label{font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#f7f8f4;stroke-width:4px;stroke-linejoin:round}.map-target{cursor:pointer}.map-target:focus{outline:none}.map-target:focus .hit{stroke:#236e63;stroke-width:3}.map-target:hover .hit{stroke:#236e63;stroke-width:3}
.dialogue-grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}.roster{padding:12px;align-self:start}.roster .object-row{padding:9px}.conversation-head{padding:18px 24px;border-bottom:1px solid var(--line)}.conversation-head h2{margin:0 0 2px}.stats{display:flex;gap:12px;margin-top:8px;font-size:12px}.stats b{font-weight:600}.conversation-toolbar{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.conversation-toolbar select{flex:1;min-width:200px}.conversation-body{padding:24px 28px;min-height:405px}.turn-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:12px}.turn-meta strong{color:var(--ink);font-size:16px}.speech{font-size:23px;line-height:1.8;margin:18px 0 25px;min-height:80px;max-width:870px}.player-label{font-size:12px;color:var(--muted);margin-bottom:8px}.choices{display:grid;gap:8px}.choice{text-align:left;padding:12px 15px;display:flex;align-items:flex-start;gap:10px;width:100%;background:#fafcfc}.choice .index{color:#9aa5ae;font-size:12px;padding-top:3px;min-width:15px}.choice .words{flex:1}.choice .requirements{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:3px}.choice .tag{color:var(--muted);font-size:12px;margin-right:5px}.conversation-foot{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.source-detail{padding-top:13px;margin-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}summary{cursor:pointer}.source-detail pre{white-space:pre-wrap;max-height:230px;overflow:auto;background:#f7f9fa;padding:12px;border-radius:6px;color:#495c6a}.outcome{padding:18px;border:1px solid #cbd9d6;border-radius:8px;background:#f5faf8}.outcome .bar{margin-top:12px}.trail{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:15px;font-size:12px}.trail button{font-size:12px;border:0;background:none;padding:2px 5px;color:var(--muted)}.script-search{width:100%;margin-bottom:16px}.script-node{border-bottom:1px solid var(--line);padding:13px 0}.script-node:last-child{border:0}.script-node button{float:right;font-size:12px;padding:4px 8px}.script-node p{margin:5px 0 8px;font-size:16px}.script-option{margin:4px 0;padding-left:12px;color:#52616b;font-size:13px;border-left:2px solid #dfe6e5}.graph-box{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fafcfc;margin-bottom:18px}.graph-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.graph-options article{border-top:2px solid #bdcec9;padding-top:12px}.graph-options .choice{margin:6px 0}.graph-box .speech{font-size:19px;min-height:0;margin:8px 0 12px}.graph-options p{font-size:14px}.subnav{display:flex;gap:6px;margin-bottom:16px}.subnav button{font-size:13px}.scene-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.timeline-list{max-height:600px;overflow:auto;padding:12px}.time-row{display:flex;text-align:left;gap:12px;width:100%;padding:10px;border:0;background:none;margin-bottom:3px;font-size:13px}.time-row.active{background:var(--soft);color:var(--ink)}.time-row time{font-size:12px;color:var(--muted);white-space:nowrap;min-width:40px}.time-row small{display:block;color:var(--muted)}.timeline-detail{padding:24px}.timeline-detail blockquote{font-size:22px;margin:20px 0}.ambient-line{padding:12px 0;border-bottom:1px solid var(--line)}.ambient-line p{font-size:18px;margin:5px 0}.ambient-line small{color:var(--muted)}.event-members{display:flex;gap:6px;margin:12px 0 18px}.file-panel{margin-top:24px;font-size:13px;color:var(--muted)}.file-panel summary{padding:10px 0}.file-panel .panel{padding:16px;margin-top:8px}.file-panel pre{max-height:420px;overflow:auto;white-space:pre-wrap;line-height:1.5;background:#f7f9fa;border-radius:6px;padding:16px;color:var(--ink)}.file-panel select{width:100%;margin-bottom:8px}
@media(max-width:1000px){.shell{padding:18px}.layout-grid{grid-template-columns:minmax(0,1fr) 245px}.map-wrap svg{height:520px}.conversation-body{padding:22px}.speech{font-size:21px}.dialogue-grid{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:760px){.mast{align-items:flex-start;flex-direction:column;gap:12px}.shell{padding:14px}.tabs{gap:3px}.tabs button{font-size:14px;padding:7px 10px}.layout-grid,.dialogue-grid,.scene-grid{grid-template-columns:1fr}.map-wrap svg{height:430px}.layout-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.layout-side .object-detail{margin:0;padding:0;border:0}.roster{display:flex;gap:5px;overflow:auto}.roster .object-row{min-width:130px;width:auto;margin:0}.conversation-body{padding:20px}.speech{font-size:20px}.graph-options{grid-template-columns:1fr}.timeline-list{max-height:230px}.conversation-toolbar{padding:12px}.conversation-head{padding:16px}.conversation-foot{padding:12px;flex-wrap:wrap}.pad{padding:16px}}

<body>
<div class="shell">
  <header class="mast"><div><h1>511 · 关卡与对白</h1><p>当前 DesignData 的可视化预览</p></div><div class="stage" role="group" aria-label="关卡阶段"><button type="button" data-stage="first_meet">第一次到城门</button><button type="button" class="active" data-stage="second_meet">第二次回城</button></div></header>
  <nav class="tabs" aria-label="预览内容"><button type="button" class="active" data-view="layout">关卡俯视图</button><button type="button" data-view="dialogue">人物与对白</button><button type="button" data-view="scene">演出与事件</button></nav>
  <main>
    <section id="view-layout">
      <div class="layout-grid">
        <div class="panel"><div class="caption bar between"><div><strong id="layout-title"></strong><p id="layout-subtitle" class="small muted"></p></div><span id="environment" class="pill"></span></div>
          <div class="map-controls"><label><input id="show-architecture" type="checkbox" checked> 场景建筑</label><label><input id="show-labels" type="checkbox" checked> 姓名与名称</label><label for="map-event">事件关系</label><select id="map-event" aria-label="查看事件参与关系"></select></div>
          <div class="map-wrap"><svg id="layout-map" viewBox="0 0 1000 650" role="group" aria-label="关卡俯视图，可点击人物或道具查看内容"></svg><div class="map-tools"><button id="zoom-in" type="button" aria-label="放大地图">＋</button><button id="zoom-out" type="button" aria-label="缩小地图">－</button><button id="zoom-reset" type="button">全图</button></div></div>
          <div class="legend"><span><i class="dot"></i>人物与朝向</span><span><i class="dot prop"></i>道具配置占地</span><span><i class="dot player"></i>玩家起点</span><span>网格：5米</span></div><p class="map-note" id="map-note"></p>
        </div>
        <aside class="panel pad layout-side"><div><h3>点选查看</h3><div class="object-list" id="object-list"></div></div><div class="object-detail" id="object-detail"></div></aside>
      </div>
    </section>
    <section id="view-dialogue" hidden>
      <div class="dialogue-grid"><aside class="panel roster" id="roster"></aside><div class="panel"><div class="conversation-head" id="npc-heading"></div><div class="conversation-toolbar"><select id="entry-select" aria-label="选择互动场景"></select><button id="restart-dialogue" type="button">从头看</button></div><div class="conversation-toolbar"><button type="button" class="active" data-mode="read">点击对白</button><button type="button" data-mode="graph">分支走向</button><button type="button" data-mode="list">全部台词</button></div><div class="conversation-body" id="conversation"></div><div class="conversation-foot"><button id="back-dialogue" type="button">← 上一句</button><span id="dialogue-position"></span><span>展示全部配置分支；不模拟存档或实时状态。</span></div></div></div>
    </section>
    <section id="view-scene" hidden>
      <div class="subnav" role="group" aria-label="演出类型"><button type="button" class="active" data-scene="opening">开场时序</button><button type="button" data-scene="events">街头事件</button><button type="button" data-scene="ambient">日常台词</button><button type="button" data-scene="journal">任务日记</button></div>
      <div class="scene-grid"><aside class="panel timeline-list" id="scene-list"></aside><div class="panel timeline-detail" id="scene-detail"></div></div>
    </section>
  </main>
  <details class="file-panel"><summary>查看本页读取的数据文件</summary><div class="panel"><select id="file-select" aria-label="选择数据源文件"></select><div id="file-hash" class="mono"></div><pre id="file-content"></pre></div></details>
</div>
<script type="application/json" id="design-data">__DESIGN_DATA__</script>
<script>
'use strict';
(() => {
const data = JSON.parse(document.getElementById('design-data').textContent);
const el = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lang = key => data.language[key] || key || '';
const npcs = Object.fromEntries(data.cast.Npcs.map(n => [n.Id, n]));
const names = Object.fromEntries(data.cast.Npcs.map(n => [n.Id, lang(n.NameKey)]));
const name = id => id === 'player' ? '你' : names[id] || id || '旁白';
const shortName = id => name(id).replace(/（.*?）/g, '');
const identity = id => lang(npcs[id]?.IdentityKey || '') || '剧情人物';
const state = {stage:'second_meet',view:'layout',object:'actor:son',actor:'son',definition:null,entry:null,node:null,
  path:[],optionPage:0,pending:null,ended:false,mode:'read',scene:'opening',sceneIndex:0,search:'',mapEvent:'',zoom:1,pan:[0,0]};
const propName = p => {
  if(p.Lock) return lang(p.Lock.TitleKey);
  const beat = data.opening.Beats.find(b=>b.Id===p.Id && b.Cmd==='prop_spawn');
  const base={lwn_market_pawn_counter:'当铺柜台与秤',lwn_market_meat_counter:'肉案与案板',lwn_market_stage:'戏台',carpet_empire_a:'台前地毯',bd_barrel_b:'摊边木桶'};
  return base[p.Prefab] || beat?.Note || p.Prefab || p.Id;
};
const actionName = action => {
  const labels={act_bartender_wipe:'擦拭柜台',act_bartender_meat:'处理肉案',act_play_celtic_harp_stand:'站立弹琴',act_beggar_idle:'蹲坐等候',act_bully:'威逼',act_bullied:'受威逼',act_argue:'争执',act_argue_2:'争执',act_argue_soft_1:'低声争执',act_bar_talk_to_2:'交谈',act_stealth_mission_guard_look_around_patrolling_cautious_1:'戒备张望'};
  if(labels[action])return labels[action];
  if((action||'').includes('threat'))return '威胁手势';
  if((action||'').startsWith('act_conversation_'))return '交谈手势';
  return action?'动作':'无指定动作';
};
const topicByFlag={};
for(const definition of data.dialogues)for(const node of definition.Nodes)for(const option of node.Options||[]){
  for(const effect of option.Effects||[])if(effect.Id==='mark'&&effect.Params?.flag)topicByFlag[effect.Params.flag]=lang(option.PlayerKey).replace(/^\[[^\]]*\]\s*/,'');
}
function condition(term,actor=state.actor){
  const neg=term.startsWith('!');let value=neg?term.slice(1):term;
  const at=value.split('@'), subject=at[1]?shortName(at[1]):shortName(actor);
  let text='';
  const fixed={quest_accepted:`已接${subject}的差事`,quest_done:`已办完${subject}的差事`,quest_turned:`已向${subject}交差`,
    gate_open:'已获城门放行',noble:'实际穿着贵族行头',disguised:'已乔装',stripped:'已换掉原装备',
    stripped_disarmed:'守卫武器已全部取走',blocker_disarmed:'守卫武器已全部取走',errand_ready:'零活冷却已结束',
    street_help_pending:'已帮老周处理保护费，谢礼尚未领取',can_redeem_keepsake:'付得起赎金，或已付款待领镯子',
    jail_done:'已刑满释放',sentence_started:'已开始服刑',has_commission:'已有活动差事'};
  if(fixed[at[0]])text=fixed[at[0]];
  else if(value.startsWith('gold>='))text=`至少${value.slice(6)}第纳尔`;
  else if(value.startsWith('step>='))text='已与此人交谈';
  else if(value.startsWith('phase:'))text={first_meet:'处于首次到城门阶段',second_meet:'处于刑满再次入场阶段',done:'本章已完成'}[value.slice(6)]||'阶段：'+value.slice(6);
  else if(value.startsWith('event_active:'))text=`${(data.plan.Behaviors['event_'+value.slice(13)]?.Members||[]).map(shortName).join('与')||'指定'}事件正在发生`;
  else if(value.startsWith('event_resolved:'))text=`${(data.plan.Behaviors['event_'+value.slice(15)]?.Members||[]).map(shortName).join('与')||'指定'}事件已解决`;
  else if(value.startsWith('resolution:'))text=value.endsWith('force')?'以武力办妥差事':'以指定办法办妥差事';
  else if(value.startsWith('item:'))text=value.includes('lockpick')?'持有撬锁包':value.includes('tunic')?'行囊里有贵族戏服':'持有所需物品';
  else if(value.startsWith('clue:'))text=value.startsWith('clue:sister_')?'已获知妹妹线索（'+value.slice(12)+'）':'已获知线索：'+value.slice(5);
  else if(value.startsWith('asked:')){
    const flag=value.slice(6);text=flag.startsWith('attempt_')?'已尝试说辞「'+lang(flag.slice(8)).replace(/^\[[^\]]*\]\s*/,'')+'」':flag==='lesson_lock_done'?'已打开练习箱':flag==='lock_permission'?'已取得小六试锁许可':topicByFlag[flag]?'已选择「'+topicByFlag[flag]+'」':'已记录话题：'+flag;
  } else if(value.startsWith('goal:'))text='已推进到对应任务步骤';
  else if(value==='money_attitude:open')text='对方愿意当面收钱';
  else if(value.startsWith('reward:'))text='已领取这笔报酬';
  else text='条件：'+value;
  if(neg)text=text.replace(/^已/,'尚未').replace(/^实际穿着/,'尚未穿着').replace(/^至少/,'少于');
  if(neg && !text.startsWith('尚未') && !text.startsWith('少于'))text='不满足：'+text;
  return text;
}
const conditions=(items,actor)=>[...new Set((items||[]).map(t=>condition(t,actor)))].join(' · ');
function capability(check){
  if(!check)return '';
  const attr=data.capabilities[check.Capability], title=lang('LWN_story_ability_'+attr), skill=lang('LWN_story_capability_'+check.Capability);
  return `<span class="pill ${esc(attr)}">${esc(title)} · ${esc(skill)}</span>`;
}
const participants=actor => actor==='npc'||actor==='questioner'?state.actor:actor;
const turnName=actor=>name(participants(actor));
function changeView(view){state.view=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  ['layout','dialogue','scene'].forEach(v=>el('view-'+v).hidden=v!==view);
  if(view==='dialogue')renderDialogue();if(view==='scene')renderScene();}
function stageChange(stage){
  state.stage=stage;state.object='';state.mapEvent='';state.zoom=1;state.pan=[0,0];
  document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage));
  const actors=data.plan.Stages[stage].Actors;
  selectActor(actors.includes(state.actor)?state.actor:actors[0]);
  renderMap();renderObjects();renderRoster();if(state.view==='scene')renderScene();
}
const viewLayout=()=>data.layouts[state.stage];
const zoomBox=()=>`${state.pan[0]} ${state.pan[1]} ${1000/state.zoom} ${650/state.zoom}`;
function setZoom(zoom){const cx=state.pan[0]+500/state.zoom,cy=state.pan[1]+325/state.zoom;state.zoom=zoom;state.pan=[cx-500/zoom,cy-325/zoom];el('layout-map').setAttribute('viewBox',zoomBox());}
let projection;
function svgPath(shape){
  const ring=r=>r.map((p,i)=>{const xy=projection(p);return `${i?'L':'M'}${xy[0].toFixed(2)},${xy[1].toFixed(2)}`;}).join(' ')+' Z';
  if(shape.type==='Polygon')return shape.coordinates.map(ring).join(' ');
  if(shape.type==='MultiPolygon')return shape.coordinates.map(p=>p.map(ring).join(' ')).join(' ');
  if(shape.type==='GeometryCollection')return shape.geometries.map(svgPath).join(' ');
  return '';
}
function renderMap(){
  const current=data.plan.Stages[state.stage], view=viewLayout(), bounds=data.map.bounds;
  const width=bounds[1]-bounds[0],height=bounds[3]-bounds[2],unit=Math.min(940/width,590/height);
  const left=(1000-width*unit)/2,top=(650-height*unit)/2;
  projection=p=>[left+(p[0]-bounds[0])*unit,top+(bounds[3]-p[1])*unit];
  el('layout-title').textContent=state.stage==='first_meet'?'初次到城门':'门外市集';
  el('layout-subtitle').textContent=`${current.Actors.length}名人物 · ${current.Props.length}件道具 · ${data.plan.Scene} · 布局版本${data.plan.ContentVersion}`;
  const env=current.Environment||data.opening.Environment||{};
  el('environment').textContent=`${String(Math.floor(env.Hour||0)).padStart(2,'0')}:00 · ${({rain:'雨',snow:'雪',clear:'晴',fog:'雾'})[env.Weather]||env.Weather||'原场景天气'}`;
  const eventGroups=Object.entries(data.plan.Behaviors).filter(([k,v])=>v.Kind==='group'&&v.Stages.includes(state.stage));
  el('map-event').innerHTML='<option value="">不叠加事件</option>'+eventGroups.map(([key,g])=>`<option value="${esc(key)}">${esc(g.Members.map(shortName).join(' / '))}</option>`).join('');el('map-event').value=state.mapEvent;

  }
  state.sceneIndex=Math.min(state.sceneIndex,Math.max(items.length-1,0));
  el('scene-list').innerHTML=items.map(([title,item],i)=>`<button type="button" class="time-row ${i===state.sceneIndex?'active':''}" data-scene-index="${i}">${item.At!==undefined?`<time>${item.At.toFixed(2)}s</time>`:''}<span>${esc(title)}</span></button>`).join('')||'<div class="empty">无配置</div>';
  el('scene-detail').innerHTML=detail;
}
function restart(){if(state.entry)goNode(state.entry.Node);state.path=state.node?[state.node]:[];state.pending=null;state.ended=false;state.optionPage=0;renderDialogue();}
document.addEventListener('click',event=>{
  const b=event.target.closest('button,[data-object]');if(!b)return;
  if(b.dataset.view){changeView(b.dataset.view);return;}
  if(b.dataset.stage){stageChange(b.dataset.stage);return;}
  if(b.dataset.object){selectObject(b.dataset.object);return;}
  if(b.dataset.talk||b.dataset.entryActor){selectActor(b.dataset.talk||b.dataset.entryActor);changeView('dialogue');return;}
  if(b.dataset.mode){state.mode=b.dataset.mode;state.pending=null;renderDialogue();return;}
  if(b.dataset.node){goNode(b.dataset.node);return;}
  if(b.dataset.option!==undefined){const option=currentNode().Options[Number(b.dataset.option)];if(option.Check){state.pending={index:Number(b.dataset.option)};renderDialogue();}else if(option.NextNode)goNode(option.NextNode);else{state.ended=true;renderDialogue();}return;}
  if(b.dataset.scene){state.scene=b.dataset.scene;state.sceneIndex=0;renderScene();return;}
  if(b.dataset.sceneIndex!==undefined){state.sceneIndex=Number(b.dataset.sceneIndex);renderScene();return;}
  if(b.dataset.joinEvent){const g=data.plan.Behaviors[b.dataset.joinEvent];const def=definitionFor(g.Host);const entry=def?.Entries.find(e=>e.Trigger==='event_join'&&e.Conditions.includes('event_active:'+b.dataset.joinEvent.slice(6)));if(entry){selectActor(g.Host,entry.Node);changeView('dialogue');}return;}
  if(b.dataset.eventMap){state.mapEvent=b.dataset.eventMap;renderMap();changeView('layout');return;}
  switch(b.id){
    case 'restart-dialogue':case 'return-entry':restart();break;
    case 'back-dialogue':if(state.ended){state.ended=false;}else if(state.pending){state.pending=null;}else if(state.path.length>1){state.path.pop();state.node=state.path[state.path.length-1];}state.optionPage=0;renderDialogue();break;
    case 'more-options':state.optionPage++;renderDialogue();break;
    case 'previous-options':state.optionPage=Math.max(0,state.optionPage-1);renderDialogue();break;
    case 'cancel-outcome':state.pending=null;renderDialogue();break;
    case 'zoom-in':setZoom(Math.min(4,state.zoom*1.25));break;
    case 'zoom-out':setZoom(Math.max(1,state.zoom/1.25));break;
    case 'zoom-reset':state.zoom=1;state.pan=[0,0];el('layout-map').setAttribute('viewBox',zoomBox());break;
    case 'beat-prev':state.sceneIndex=Math.max(0,state.sceneIndex-1);renderScene();break;
    case 'beat-next':state.sceneIndex=Math.min(data.opening.Beats.length-1,state.sceneIndex+1);renderScene();break;
    case 'beat-map':{const beat=data.opening.Beats[state.sceneIndex];if(beat.Actor)state.object='actor:'+beat.Actor;else if(beat.Cmd==='prop_spawn')state.object='prop:'+beat.Id;renderMap();renderObjects();changeView('layout');break;}
  }
});
document.addEventListener('keydown',e=>{const target=e.target.closest('[data-object]');if(target && (e.key==='Enter'||e.key===' ')){e.preventDefault();selectObject(target.dataset.object);}});
el('entry-select').addEventListener('change',e=>{state.entry=state.definition.Entries[Number(e.target.value)];state.node=state.entry.Node;state.path=[state.node];state.pending=null;state.ended=false;state.optionPage=0;renderDialogue();});
for(const id of ['show-architecture','show-labels'])el(id).addEventListener('change',renderMap);
el('map-event').addEventListener('change',e=>{state.mapEvent=e.target.value;renderMap();});
document.addEventListener('input',e=>{if(e.target.id==='script-search'){const caret=e.target.selectionStart;state.search=e.target.value;renderScriptList();const input=el('script-search');input.focus();input.setSelectionRange(caret,caret);}});
const map=el('layout-map');let drag=null,moved=false;
map.addEventListener('pointerdown',e=>{if(e.target.closest('[data-object]'))return;drag=[e.clientX,e.clientY,...state.pan];moved=false;map.setPointerCapture(e.pointerId);map.classList.add('dragging');});
map.addEventListener('pointermove',e=>{if(!drag)return;const rect=map.getBoundingClientRect();state.pan=[drag[2]-(e.clientX-drag[0])*1000/rect.width/state.zoom,drag[3]-(e.clientY-drag[1])*650/rect.height/state.zoom];moved=true;map.setAttribute('viewBox',zoomBox());});
map.addEventListener('pointerup',()=>{drag=null;map.classList.remove('dragging');});map.addEventListener('pointercancel',()=>{drag=null;map.classList.remove('dragging');});
map.addEventListener('wheel',e=>{e.preventDefault();setZoom(Math.min(4,Math.max(1,state.zoom*(e.deltaY<0?1.1:1/1.1))));},{passive:false});
const files=Object.keys(data.sources);el('file-select').innerHTML=files.map((file,i)=>`<option value="${i}">${esc(file)}</option>`).join('');
function renderFile(){const file=files[Number(el('file-select').value)||0],source=data.sources[file];el('file-hash').textContent='SHA-256 '+source.sha256;el('file-content').textContent=source.text;}
el('file-select').addEventListener('change',renderFile);renderFile();
selectActor(state.actor);renderMap();renderObjects();renderRoster();
// Read-only handles allow the offline verifier to exercise the actual viewer functions.
globalThis.storyPreview={data,state,selectActor,goNode,renderDialogue,renderMap,changeView,stageChange,condition};
})();
</script>
