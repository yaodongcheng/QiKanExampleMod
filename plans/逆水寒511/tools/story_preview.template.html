<body>
<div class="shell">
  <header class="mast"><div><h1>511 · 关卡与对白</h1><p>当前 DesignData 的可视化预览</p></div><div class="stage" role="group" aria-label="关卡阶段"><button type="button" data-stage="first_meet">第一次到城门</button><button type="button" class="active" data-stage="second_meet">第二次回城</button></div></header>
  <nav class="tabs" aria-label="预览内容"><button type="button" class="active" data-view="layout">关卡俯视图</button><button type="button" data-view="dialogue">人物与对白</button><button type="button" data-view="scene">演出与事件</button><button type="button" data-view="guide">攻略</button></nav>
  <main>
    <section id="view-layout">
      <div class="layout-grid">
        <div class="panel"><div class="caption bar between"><div><strong id="layout-title"></strong><p id="layout-subtitle" class="small muted"></p></div><span id="environment" class="pill"></span></div>
          <div class="map-controls"><label><input id="show-architecture" type="checkbox" checked> 场景建筑</label><label><input id="show-labels" type="checkbox" checked> 姓名与名称</label><label for="map-event">事件关系</label><select id="map-event" aria-label="查看事件参与关系"></select></div>
          <div class="map-wrap"><svg id="layout-map" viewBox="0 0 650 1000" role="group" aria-label="关卡俯视图，可点击人物或道具查看内容"></svg><div class="map-tools"><button id="zoom-in" type="button" aria-label="放大地图">＋</button><button id="zoom-out" type="button" aria-label="缩小地图">－</button><button id="zoom-reset" type="button">全图</button></div></div>
          <div class="legend"><span><i class="dot"></i>人物与朝向（名字在圆圈正下方）</span><span><i class="dot prop"></i>道具占地（名字用蓝色虚线引注）</span><span><i class="dot player"></i>玩家起点</span><span id="event-legend" hidden><i class="dot event"></i>选中事件的说话关系</span><span>网格：5米</span></div><p class="map-note" id="map-note"></p>
        </div>
        <aside class="panel pad layout-side"><div><h3>点选查看</h3><div class="object-list" id="object-list"></div></div><div class="object-detail" id="object-detail"></div></aside>
      </div>
    </section>
    <section id="view-dialogue" hidden>
      <div class="dialogue-grid"><aside class="panel roster" id="roster"></aside><div class="panel"><div class="conversation-head" id="npc-heading"></div><div class="conversation-toolbar"><select id="entry-select" aria-label="选择互动场景"></select><button id="restart-dialogue" type="button">从头看</button></div><div class="conversation-toolbar"><button type="button" class="active" data-mode="read">点击对白</button><button type="button" data-mode="graph">分支走向</button><button type="button" data-mode="list">全部台词</button></div><div class="conversation-body" id="conversation"></div><div class="conversation-foot"><button id="back-dialogue" type="button">← 上一句</button><span id="dialogue-position"></span><span>展示全部配置分支；不模拟存档或实时状态。</span></div></div></div>
    </section>
    <section id="view-scene" hidden>
      <div class="subnav" role="group" aria-label="演出类型"><button type="button" class="active" data-scene="opening">开场时序</button><button type="button" data-scene="events">街头事件</button><button type="button" data-scene="ambient">日常台词</button><button type="button" data-scene="journal">任务日记</button></div><p class="scene-hint small muted" id="scene-hint"></p>
      <div class="scene-grid"><aside class="panel timeline-list" id="scene-list"></aside><div class="panel timeline-detail" id="scene-detail"></div></div>
    </section>
    <section id="view-guide" hidden><div id="guide-content"></div></section>
  </main>
  <details class="file-panel"><summary>查看本页读取的数据文件</summary><div class="panel"><select id="file-select" aria-label="选择数据源文件"></select><div id="file-hash" class="mono"></div><pre id="file-content"></pre></div></details>
</div>
<script type="application/json" id="design-data">__DESIGN_DATA__</script>
<script>
'use strict';
(() => {
const data = JSON.parse(document.getElementById('design-data').textContent);
const el = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lang = key => data.language[key] || key || '';
const npcs = Object.fromEntries(data.cast.Npcs.map(n => [n.Id, n]));
const names = Object.fromEntries(data.cast.Npcs.map(n => [n.Id, lang(n.NameKey)]));
const name = id => id === 'player' ? '你' : names[id] || id || '旁白';
const shortName = id => name(id).replace(/（.*?）/g, '');
const identity = id => lang(npcs[id]?.IdentityKey || '') || '剧情人物';
const state = {stage:'second_meet',view:'layout',object:'actor:son',actor:'son',definition:null,entry:null,node:null,
  path:[],optionPage:0,pending:null,ended:false,mode:'read',scene:'opening',sceneIndex:0,search:'',mapEvent:'',zoom:1,pan:[0,0],guideAbility:'all'};
const propName = p => {
  if(p.Lock) return lang(p.Lock.TitleKey);
  const beat = data.opening.Beats.find(b=>b.Id===p.Id && b.Cmd==='prop_spawn');
  const base={lwn_market_pawn_counter:'当铺柜台与秤',lwn_market_meat_counter:'肉案与案板',lwn_market_stage:'戏台',carpet_empire_a:'台前地毯',bd_barrel_b:'摊边木桶'};
  return base[p.Prefab] || beat?.Note || p.Prefab || p.Id;
};
const actionName = action => {
  const labels={act_bartender_wipe:'擦拭柜台',act_bartender_meat:'处理肉案',act_play_celtic_harp_stand:'站立弹琴',act_beggar_idle:'蹲坐等候',act_bully:'威逼',act_bullied:'受威逼',act_argue:'争执',act_argue_2:'争执',act_argue_soft_1:'低声争执',act_bar_talk_to_2:'交谈',act_main_story_troop_guard_idle_2:'站岗戒备'};
  if(labels[action])return labels[action];
  if((action||'').includes('threat'))return '威胁手势';
  if((action||'').startsWith('act_conversation_'))return '交谈手势';
  return action?'动作':'无指定动作';
};
const presentationDescription = action => {
  const presentation=data.plan.ActionPresentations?.[action];
  if(!presentation)return '';
  const instrument={harp:'竖琴'}[presentation.Instrument]||'乐器';
  return `${presentation.Instrument?'抱着'+instrument+'演奏。':''}${presentation.Sounds?.length?'演奏声从人物所在的位置传来。':''}交谈或被打断时停止，回去工作后继续。`;
};
const topicByFlag={};
for(const definition of data.dialogues)for(const node of definition.Nodes)for(const option of node.Options||[]){
  for(const effect of option.Effects||[])if(effect.Id==='mark'&&effect.Params?.flag)topicByFlag[effect.Params.flag]=lang(option.PlayerKey).replace(/^\[[^\]]*\]\s*/,'');
}
// 每条条件同时写好「成立」和「不成立」两种说法。
// 旧做法只在句首把「已」换成「尚未」，碰到「守卫武器已全部取走」这类短语就
// 只能硬加「不满足：」前缀，读起来像在说相反的意思。
function condition(term,actor=state.actor){
  const neg=term.startsWith('!');const value=neg?term.slice(1):term;
  const at=value.split('@'), subject=at[1]?shortName(at[1]):shortName(actor);
  let text='',opposite='';
  const fixed={
    quest_accepted:[`已接${subject}的差事`,`还没接${subject}的差事`],
    quest_done:[`已办完${subject}的差事`,`还没办完${subject}的差事`],
    quest_turned:[`已向${subject}交差`,`还没向${subject}交差`],
    gate_open:['已获城门放行','尚未获城门放行'],
    noble:['实际穿着贵族行头','尚未穿着贵族行头'],
    disguised:['已乔装','尚未乔装'],
    stripped:['已换掉原装备','还没换掉原装备'],
    stripped_disarmed:['守卫武器已全部取走','守卫武器尚未全部取走'],
    blocker_disarmed:['守卫武器已全部取走','守卫武器尚未全部取走'],
    errand_ready:['零活冷却已结束','零活冷却还没结束'],
    street_help_pending:['已帮老周处理保护费，谢礼还没领','还没帮老周处理保护费，或谢礼已经领了'],
    can_redeem_keepsake:['付得起赎金，或已付款待领镯子','付不起赎金，也没有已付款待领的镯子'],
    jail_done:['已刑满释放','还没刑满释放'],
    sentence_started:['已开始服刑','还没开始服刑'],
    has_commission:['已有活动差事','没有活动差事']};
  const pair=fixed[at[0]];
  if(pair){text=pair[0];opposite=pair[1];}
  else if(value.startsWith('gold>=')){const n=value.slice(6);text=`至少${n}第纳尔`;opposite=`少于${n}第纳尔`;}
  else if(value.startsWith('step>=')){text='已与此人交谈';opposite='还没与此人交谈';}
  else if(value.startsWith('phase:')){
    const phases={first_meet:['处于首次到城门阶段','不处于首次到城门阶段'],second_meet:['处于刑满再次入场阶段','不处于刑满再次入场阶段'],done:['本章已完成','本章尚未完成']};
    const p=phases[value.slice(6)]||['阶段：'+value.slice(6),'不处于该阶段：'+value.slice(6)];text=p[0];opposite=p[1];
  }
  else if(value.startsWith('event_active:')){const who=(data.plan.Behaviors['event_'+value.slice(13)]?.Members||[]).map(shortName).join('与')||'指定';text=`${who}事件正在发生`;opposite=`${who}事件没有在发生`;}
  else if(value.startsWith('event_resolved:')){const who=(data.plan.Behaviors['event_'+value.slice(15)]?.Members||[]).map(shortName).join('与')||'指定';text=`${who}事件已解决`;opposite=`${who}事件尚未解决`;}
  else if(value.startsWith('resolution:')){const how=value.endsWith('force')?'以武力':'以指定办法';text=how+'办妥差事';opposite='还没'+how+'办妥差事';}
  else if(value.startsWith('item:')){const what=value.includes('lockpick')?'撬锁包':value.includes('tunic')?'贵族戏服':'所需物品';text=(value.includes('tunic')?'行囊里有':'持有')+what;opposite='没有'+what;}
  else if(value.startsWith('clue:')){const what=value.startsWith('clue:sister_')?'妹妹线索（'+value.slice(12)+'）':'线索：'+value.slice(5);text='已获知'+what;opposite='还没获知'+what;}
  else if(value.startsWith('asked:')){
    const flag=value.slice(6);
    if(flag.startsWith('attempt_')){const line='说辞「'+lang(flag.slice(8)).replace(/^\[[^\]]*\]\s*/,'')+'」';text='已尝试'+line;opposite='还没试过'+line;}

function renderBranchGraph(node){
  if(node.NextNode){const next=state.definition.Nodes.find(n=>n.Id===node.NextNode);return `<div class="graph-box"><p class="small muted">↓ NPC下一句</p><p>${esc(turnName(next.Speaker))}：${esc(lang(next.TextKey))}</p><button type="button" data-node="${esc(next.Id)}">沿这句继续</button></div>`;}
  if(!node.Options?.length)return '<p class="small muted">这段交谈在此结束。</p><button type="button" id="return-entry">回到开场</button>';
  return '<div class="graph-options">'+(node.Options||[]).map((o,i)=>{
    const targets=o.Check?[[o.Check.Success,'成功'],[o.Check.Fail,'失败']]:[[o.NextNode,'回应']];
    return '<article>'+optionButton(o,i)+targets.map(([id,label])=>{const next=state.definition.Nodes.find(n=>n.Id===id);return next?`<div class="graph-box"><p class="small muted">↓ ${label}${state.path.includes(id)?' · 返回前面的话题':''}</p><p>${esc(turnName(next.Speaker))}：${esc(lang(next.TextKey))}</p><button type="button" data-node="${esc(id)}">查看后续 →</button></div>`:`<p class="small muted">交谈结束</p>`;}).join('')+'</article>';

function renderScriptList(){

const beatTitle=b=>({player_freeze:'玩家暂时停止操作',player_release:'恢复玩家操作',camera_cut:'镜头切到'+(b.Actor?shortName(b.Actor):'指定对象'),camera_return:'镜头还回玩家',prop_spawn:'布设'+propName(b),actor_place:'安排'+shortName(b.Actor)+'站位',actor_action:shortName(b.Actor)+' · '+actionName(b.Action),actor_say:shortName(b.Actor)+'开口',inquiry:'弹窗确认',wait:'等待',say:'人物开口'})[b.Cmd]||b.Cmd;
const groups=()=>Object.entries(data.plan.Behaviors).filter(([k,v])=>v.Kind==='group'&&v.Stages.includes(state.stage));
function renderScene(){

      if(beat.Action)detail+=`<p>动作：${esc(actionName(beat.Action))}</p><p>${esc(presentationDescription(beat.Action))}</p>`;

    if(event){detail=`<p class="small muted">街头事件 · 配置的参与关系</p><h2>${esc(event.Members.map(shortName).join('与'))}</h2><div class="event-members">${event.Members.map(id=>`<span class="pill">${esc(name(id))}</span>`).join('')}</div>`;
      detail+=event.Lines.map((key,i)=>`<article class="ambient-line"><small>${esc(name(event.Speakers[i]))} → ${esc(name(event.Listeners[i]))}</small><p>${esc(lang(key))}</p></article>`).join('');
      detail+=`<div class="bar" style="margin-top:20px"><button type="button" data-join-event="${esc(event.Id)}">查看玩家介入台本 →</button><button type="button" data-event-map="${esc(event.Id)}">在俯视图看参与者</button></div><details class="source-detail"><summary>事件数据</summary><pre class="mono">${esc(JSON.stringify(event,null,2))}</pre></details>`;
    }else detail='<div class="empty">本阶段没有街头事件。</div>';
  }else if(state.scene==='ambient'){
    items=data.cast.StreetLife.filter(l=>data.plan.Stages[state.stage].Actors.includes(l.NpcId)).map(l=>[shortName(l.NpcId),l]);const life=items[Math.min(state.sceneIndex,items.length-1)]?.[1];
    if(life){
      detail=`<h2>${esc(name(life.NpcId))} · 日常台词</h2>`;
      const speech=life.Speech?.length?life.Speech:[{Listener:life.Listener,LineKeys:life.LineKeys||[]}];

      detail+=`<p style="margin-top:20px">动作：${esc((life.Actions||[]).map(actionName).join('、'))}</p><button type="button" data-entry-actor="${esc(life.NpcId)}">查看正式对白 →</button><details class="source-detail"><summary>日常数据</summary><pre class="mono">${esc(JSON.stringify(life,null,2))}</pre></details>`;
    }

  }else if(state.scene==='journal'){

    if(entry){detail=`<p class="small muted">任务日记</p><h2>${esc(lang(entry.TextKey))}</h2><p style="margin-top:18px" class="small muted">记录条件：${esc(conditions(entry.Conditions)||'无附加条件')}</p>`;
      if(entry.SourceTextKey)detail+=`<article class="ambient-line"><small>信息来自这句台词</small><p>${esc(lang(entry.SourceTextKey))}</p></article>`;
      detail+=`<details class="source-detail"><summary>日记数据</summary><pre class="mono">${esc(JSON.stringify(entry,null,2))}</pre></details>`;
    }
  }
  state.sceneIndex=Math.min(state.sceneIndex,Math.max(items.length-1,0));
  el('scene-list').innerHTML=items.map(([title,item],i)=>`<button type="button" class="time-row ${i===state.sceneIndex?'active':''}" data-scene-index="${i}">${item.At!==undefined?`<time>${item.At.toFixed(2)}s</time>`:''}<span>${esc(title)}</span></button>`).join('')||'<div class="empty">无配置</div>';
  el('scene-detail').innerHTML=detail;
}
function renderGuide(){
  const guide=data.walkthrough,labels={money:'钱路',force:'武力',guile:'技巧',charm:'魅力'};
  const list=items=>`<ul>${items.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  // 步骤可分小组：step.Heading 另起一条小标题并重新编号，路线卡片原样（无 Heading 时输出与旧版一致）。
  const stepItem=step=>`<li>${esc(step.Text)}${(step.Links||[]).map(link=>`${link.PlayerLine?`<blockquote>对应选择：${esc(link.PlayerLine)}</blockquote>`:''}<div class="guide-links"><button type="button" data-guide-actor="${esc(link.Actor)}" data-guide-node="${esc(link.Node)}">${esc(link.Label)} · 看对白</button><button type="button" data-guide-map="${esc(link.Actor)}">在地图找${esc(shortName(link.Actor))}</button></div>`).join('')}</li>`;
  const steps=items=>{let out='',open=false;
    for(const step of items){
      if(step.Heading){if(open){out+='</ol>';open=false;}out+=`<h4>${esc(step.Heading)}</h4>`;}
      if(!open){out+='<ol>';open=true;}
      out+=stepItem(step);
    }
    return out+(open?'</ol>':'');
  };
  let out=`<div class="panel pad guide-intro"><h2>${esc(guide.Title)}</h2><p>${esc(guide.Intro)}</p>${state.stage==='first_meet'?'<p class="stage-note">你现在选的是第一次到城门。下面先展示第二次入场的路线；点攻略里的对白或地图链接会切到第二次回城。</p>':''}<details><summary>动身前要知道的事</summary><ul class="guide-notes">${guide.BeforeYouGo.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details></div>`;
  out+=`<div class="bar guide-filter" role="group" aria-label="按通关手段筛选"><span class="small muted">查看路线</span>${Object.entries({all:'全部',...labels}).map(([id,label])=>`<button type="button" class="${state.guideAbility===id?'active':''}" data-guide-ability="${id}">${label}</button>`).join('')}</div><div class="guide-grid">`;
  for(const route of guide.Routes.filter(r=>state.guideAbility==='all'||r.Ability===state.guideAbility)){
    out+=`<details class="panel guide-route"><summary><span class="pill ${route.Ability}">${labels[route.Ability]}</span> <span class="pill">${route.GrantsPass?'有通行令牌':'无通行令牌'}</span><h3>${esc(route.Title)}</h3><p class="small muted">${esc(route.Summary)}</p><span class="guide-toggle">展开条件、步骤和失败补救</span></summary><div class="guide-body"><h4>需要什么</h4>${list(route.Conditions)}<h4>具体怎么走</h4>${steps(route.Steps)}<h4>失败了怎么办</h4>${list(route.Recovery)}<div class="guide-result"><strong>通关结果</strong><p>${esc(route.Result)}</p></div></div></details>`;
  }

  el('guide-content').innerHTML=out;
}
function showGuideDialogue(actor,node){

}
function showGuideMap(actor){

function restart(){if(state.entry)goNode(state.entry.Node);state.path=state.node?[state.node]:[];state.pending=null;state.ended=false;state.optionPage=0;renderDialogue();}
document.addEventListener('click',event=>{
  const b=event.target.closest('button,[data-object]');if(!b)return;
  if(b.dataset.view){changeView(b.dataset.view);return;}
  if(b.dataset.stage){stageChange(b.dataset.stage);return;}
  if(b.dataset.guideAbility){state.guideAbility=b.dataset.guideAbility;renderGuide();return;}
  if(b.dataset.guideActor){showGuideDialogue(b.dataset.guideActor,b.dataset.guideNode);return;}
  if(b.dataset.guideMap){showGuideMap(b.dataset.guideMap);return;}
  if(b.dataset.object){selectObject(b.dataset.object);return;}
  if(b.dataset.talk||b.dataset.entryActor){selectActor(b.dataset.talk||b.dataset.entryActor);changeView('dialogue');return;}
  if(b.dataset.mode){state.mode=b.dataset.mode;state.pending=null;renderDialogue();return;}
  if(b.dataset.node){goNode(b.dataset.node);return;}
  if(b.dataset.option!==undefined){const option=currentNode().Options[Number(b.dataset.option)];if(option.Check){state.pending={index:Number(b.dataset.option)};renderDialogue();}else if(option.NextNode)goNode(option.NextNode);else{state.ended=true;renderDialogue();}return;}
  if(b.dataset.scene){state.scene=b.dataset.scene;state.sceneIndex=0;renderScene();return;}
  if(b.dataset.sceneIndex!==undefined){state.sceneIndex=Number(b.dataset.sceneIndex);renderScene();return;}
  if(b.dataset.joinEvent){const g=data.plan.Behaviors[b.dataset.joinEvent];const def=definitionFor(g.Host);const entry=def?.Entries.find(e=>e.Trigger==='event_join'&&e.Conditions.includes('event_active:'+b.dataset.joinEvent.slice(6)));if(entry){selectActor(g.Host,entry.Node);changeView('dialogue');}return;}
  if(b.dataset.eventMap){state.mapEvent=b.dataset.eventMap;renderMap();changeView('layout');return;}
  switch(b.id){
    case 'restart-dialogue':case 'return-entry':restart();break;
    case 'back-dialogue':if(state.ended){state.ended=false;}else if(state.pending){state.pending=null;}else if(state.path.length>1){state.path.pop();state.node=state.path[state.path.length-1];}state.optionPage=0;renderDialogue();break;
    case 'more-options':state.optionPage++;renderDialogue();break;
    case 'previous-options':state.optionPage=Math.max(0,state.optionPage-1);renderDialogue();break;
    case 'cancel-outcome':state.pending=null;renderDialogue();break;
    case 'zoom-in':setZoom(Math.min(4,state.zoom*1.25));break;
    case 'zoom-out':setZoom(Math.max(1,state.zoom/1.25));break;
    case 'zoom-reset':state.zoom=1;state.pan=[0,0];el('layout-map').setAttribute('viewBox',zoomBox());break;
    case 'beat-prev':state.sceneIndex=Math.max(0,state.sceneIndex-1);renderScene();break;
    case 'beat-next':state.sceneIndex=Math.min(data.opening.Beats.length-1,state.sceneIndex+1);renderScene();break;
    case 'beat-map':{const beat=data.opening.Beats[state.sceneIndex];if(beat.Actor)state.object='actor:'+beat.Actor;else if(beat.Cmd==='prop_spawn')state.object='prop:'+beat.Id;renderMap();renderObjects();changeView('layout');break;}
  }
});
document.addEventListener('keydown',e=>{const target=e.target.closest('[data-object]');if(target && (e.key==='Enter'||e.key===' ')){e.preventDefault();selectObject(target.dataset.object);}});
el('entry-select').addEventListener('change',e=>{state.entry=state.definition.Entries[Number(e.target.value)];state.node=state.entry.Node;state.path=[state.node];state.pending=null;state.ended=false;state.optionPage=0;renderDialogue();});
for(const id of ['show-architecture','show-labels'])el(id).addEventListener('change',renderMap);
el('map-event').addEventListener('change',e=>{state.mapEvent=e.target.value;renderMap();});
document.addEventListener('input',e=>{if(e.target.id==='script-search'){const caret=e.target.selectionStart;state.search=e.target.value;renderScriptList();const input=el('script-search');input.focus();input.setSelectionRange(caret,caret);}});
const map=el('layout-map');let drag=null,moved=false;
map.addEventListener('pointerdown',e=>{if(e.target.closest('[data-object]'))return;drag=[e.clientX,e.clientY,...state.pan];moved=false;map.setPointerCapture(e.pointerId);map.classList.add('dragging');});
map.addEventListener('pointermove',e=>{if(!drag)return;const rect=map.getBoundingClientRect(),scale=Math.min(rect.width/mapSize.width,rect.height/mapSize.height)*state.zoom;state.pan=[drag[2]-(e.clientX-drag[0])/scale,drag[3]-(e.clientY-drag[1])/scale];moved=true;map.setAttribute('viewBox',zoomBox());});
map.addEventListener('pointerup',()=>{drag=null;map.classList.remove('dragging');});map.addEventListener('pointercancel',()=>{drag=null;map.classList.remove('dragging');});
map.addEventListener('wheel',e=>{e.preventDefault();setZoom(Math.min(4,Math.max(1,state.zoom*(e.deltaY<0?1.1:1/1.1))));},{passive:false});
const files=Object.keys(data.sources);el('file-select').innerHTML=files.map((file,i)=>`<option value="${i}">${esc(file)}</option>`).join('');
function renderFile(){const file=files[Number(el('file-select').value)||0],source=data.sources[file];el('file-hash').textContent='SHA-256 '+source.sha256;el('file-content').textContent=source.text;}
el('file-select').addEventListener('change',renderFile);renderFile();
selectActor(state.actor);renderMap();renderObjects();renderRoster();
// Read-only handles allow the offline verifier to exercise the actual viewer functions.
globalThis.storyPreview={data,state,selectActor,goNode,renderDialogue,renderMap,changeView,stageChange,condition,renderGuide,showGuideDialogue,showGuideMap,renderScene};
})();
